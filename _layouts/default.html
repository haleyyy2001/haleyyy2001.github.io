<!DOCTYPE HTML>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>{% if page.title %}{{ page.title }} | Huilin Tai{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <meta name="author" content="Huilin Tai">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="{{ page.url | absolute_url }}">

  <link rel="icon" href="{{ '/favicon.ico' | relative_url }}" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ '/images/favicon/favicon-32.png' | relative_url }}">
  <link rel="apple-touch-icon" href="{{ '/images/favicon/apple-touch-icon.png' | relative_url }}">
  <link rel="stylesheet" href="{{ '/stylesheet.css' | relative_url }}">

  <meta property="og:title" content="{% if page.title %}{{ page.title }} | Huilin Tai{% else %}{{ site.title }}{% endif %}">
  <meta property="og:description" content="{{ page.description | default: site.description }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">

  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>

  <header class="topbar">
    <div class="topbar-inner">

      <nav class="topbar-left">
        <a href="mailto:ht62@rice.edu" aria-label="Email">
          <i class="fa-regular fa-envelope"></i>
        </a>

        <a href="https://scholar.google.com/citations?user=rTtekREAAAAJ&hl=en" target="_blank" aria-label="Google Scholar">
          <i class="fa-solid fa-graduation-cap"></i>
        </a>

        <a href="https://github.com/haleyyy2001" target="_blank" aria-label="GitHub">
          <i class="fa-brands fa-github"></i>
        </a>
      </nav>

      <nav class="topbar-right">
        <a href="{{ '/' | relative_url }}#about">about</a>
        <a href="{{ '/' | relative_url }}#publications">publications</a>
        <a href="{{ '/blog/' | relative_url }}" class="active">blog</a>
        <a href="{{ '/' | relative_url }}#contact">contact</a>
      </nav>

    </div>
  </header>

  <main class="page">
    {{ content }}
  </main>

</body>
</html>
